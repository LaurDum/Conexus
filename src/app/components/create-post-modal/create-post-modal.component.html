<div class="modal-overlay" *ngIf="stateService.createModalOpenSubject | async">
    <div class="modal-card">
        <div class="modal-header">
            <h3>New Inspo Post</h3>
            <button class="modal-close" (click)="close()">&times;</button>
        </div>
        <form (ngSubmit)="submitPost()">
            <div class="form-group">
                <label>Post Content</label>
                <textarea 
                    [(ngModel)]="postText" 
                    name="postText"
                    rows="4" 
                    placeholder="Share an idea, question, project update, or collab callout..." 
                    required></textarea>
            </div>
            <div class="form-group">
                <label>Category / Niche Tag</label>
                <select [(ngModel)]="postNiche" name="postNiche">
                    <option value="Tech Creator">Tech</option>
                    <option value="Gaming Creator">Gaming</option>
                    <option value="Travel Creator">Travel</option>
                    <option value="Music Creator">Music</option>
                    <option value="Lifestyle Creator">Lifestyle</option>
                </select>
            </div>
            <div class="modal-actions">
                <button type="button" class="btn-secondary" (click)="close()">Cancel</button>
                <button type="submit" class="btn-primary">Post to Network</button>
            </div>
        </form>
    </div>
</div>

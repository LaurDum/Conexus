<div class="view-header">
    <h2>Discover Creators</h2>
    <p class="view-subtitle">Search and connect with creators across niches worldwide.</p>
</div>

<!-- Search & Filters -->
<div class="search-container">
    <div class="search-box">
        <span class="search-icon">⌕</span>
        <input 
            type="text" 
            [(ngModel)]="searchQuery" 
            placeholder="Search by name, niche, city or topic...">
        <button 
            class="search-clear" 
            *ngIf="searchQuery.length > 0" 
            (click)="clearSearch()">&times;</button>
    </div>

    <div class="filter-chips">
        <button 
            *ngFor="let cat of categories" 
            class="chip" 
            [class.active]="selectedCategory === cat.value"
            (click)="selectCategory(cat.value)">
            {{ cat.label }}
        </button>
    </div>
</div>

<!-- Trending Topics -->
<div class="trending-bar">
    <span class="trending-label">🔥 Trending:</span>
    <button 
        *ngFor="let tag of trendingTags" 
        class="trending-tag" 
        (click)="setTag(tag)">
        {{ tag }}
    </button>
</div>

<!-- Creator Grid -->
<div class="discover-grid">
    <div *ngIf="filteredCreators.length === 0" style="grid-column: 1 / -1; text-align: center; padding: 30px; color: var(--muted); font-size: 0.8rem;">
        No creators found matching your search criteria.
    </div>

    <article class="creator-card discover-card" *ngFor="let c of filteredCreators">
        <div class="creator-avatar" [ngClass]="c.bgClass">{{ c.avatar }}</div>
        <h3>{{ c.name }}</h3>
        <p class="creator-type">{{ c.niche }}</p>
        <div class="creator-info">{{ c.location }}</div>
        <div class="creator-followers">{{ c.followers }} followers</div>
        <div class="match"><span>{{ c.match }}%</span> match</div>
        <button 
            class="connect-button" 
            [class.connected]="connectedState[c.id]"
            (click)="toggleConnect(c.id)">
            {{ connectedState[c.id] ? 'Requested' : 'Connect' }}
        </button>
    </article>
</div>

# ============================================================
#  Conexus Backend — Application Configuration
# ============================================================

# Server
# Hosting platforms (Render, Railway, Fly, Heroku) assign a port at runtime and
# route traffic to it; a hardcoded port means the platform's health check finds
# nothing and the deploy is marked failed. Falls back to 8080 locally.
server.port=${PORT:8080}

# ----------------------------------------------------------------
#  PostgreSQL DataSource
#  Update the password to match your local PostgreSQL install.
# ----------------------------------------------------------------
# Defaults point at a local PostgreSQL. To use a hosted database instead, set
# DB_URL / DB_USER / DB_PASSWORD in backend/application-local.properties (not in
# version control) or as real environment variables — no code change needed.
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/conexus_db}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# The password lives in backend/application-local.properties, which is not in
# version control. Copy application-local.properties.example to create it.
spring.config.import=optional:file:./application-local.properties

# ----------------------------------------------------------------
#  JPA / Hibernate
#  ddl-auto=update  →  creates/updates tables automatically
#  Change to 'validate' in production.
# ----------------------------------------------------------------
spring.jpa.hibernate.ddl-auto=update

# Logging every statement is useful when debugging locally and far too noisy in
# production, where it also slows every request. Set SHOW_SQL=true to bring it back.
spring.jpa.show-sql=${SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# ----------------------------------------------------------------
#  Connection pool
#  Hosted Postgres plans cap how many connections you may hold, and the
#  default pool of 10 is more than a free tier allows alongside anything else.
# ----------------------------------------------------------------
spring.datasource.hikari.maximum-pool-size=${DB_POOL_SIZE:5}
spring.datasource.hikari.connection-timeout=20000

# Seeding is done by DataSeeder, not a data.sql file.
spring.jpa.defer-datasource-initialization=true


# ============================================================
#  Conexus Backend — Application Configuration
# ============================================================

# Server
server.port=8080

# ----------------------------------------------------------------
#  PostgreSQL DataSource
#  Update the password to match your local PostgreSQL install.
# ----------------------------------------------------------------
spring.datasource.url=jdbc:postgresql://localhost:5432/conexus_db
spring.datasource.username=postgres
spring.datasource.driver-class-name=org.postgresql.Driver

# The password lives in backend/application-local.properties, which is not in
# version control. Copy application-local.properties.example to create it.
spring.config.import=optional:file:./application-local.properties

# ----------------------------------------------------------------
#  JPA / Hibernate
#  ddl-auto=update  →  creates/updates tables automatically
#  Change to 'validate' in production.
# ----------------------------------------------------------------
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# ----------------------------------------------------------------
#  Seed data (src/main/resources/data.sql) runs once on startup
# ----------------------------------------------------------------
spring.sql.init.mode=always
spring.jpa.defer-datasource-initialization=true

